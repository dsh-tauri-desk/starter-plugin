catalogMode: prefer
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@types/node@25.9.0'
  - tsx@4.22.2
  - bumpp@12.0.0
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - playground
  - docs
  - packages/*
  - examples/*

catalogs:
  cli:
    '@antfu/eslint-config': ^9.1.0
    '@antfu/ni': ^30.2.0
    bumpp: ^12.0.0
    eslint: ^10.7.0
    nano-staged: ^1.0.2
    publint: ^0.3.21
    simple-git-hooks: ^2.13.1
    skills-npm: ^1.2.0
    tsdown: ^0.22.12
    tsx: ^4.23.1
    typescript: ^6.0.3
    vite: ^8.1.5
  dsh:
    '@deepseek-ai/cordis': 4.0.1
    '@deepseek-ai/dsh-client-runtime': 0.1.1-rc.2
    '@deepseek-ai/dsh-client-ui-layout': 0.1.1-rc.2
    '@deepseek-ai/dsh-client-ui-primitives': 0.1.1-rc.2
    '@deepseek-ai/dsh-client-ui-renderer': 0.1.1-rc.2
    '@deepseek-ai/dsh-skill-filesystem': ^0.1.1-rc.1
  inlined:
    '@antfu/utils': ^9.3.0
  testing:
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.0.0
    vitest: ^4.1.10
  types:
    '@types/node': ^26.1.1
  ui:
    css-render: ^0.15.14
allowBuilds:
  esbuild: true
  simple-git-hooks: true
